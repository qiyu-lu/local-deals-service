services:
  mysql:
    image: mysql:8.0
    container_name: local-deals-mysql
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: local_deals
    volumes:
      - ./mysql-data:/var/lib/mysql
    command:
      --default-authentication-plugin=mysql_native_password
    networks:
      - local-deals-net

  redis:
    image: redis:6.2
    container_name: local-deals-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - ./redis-data:/data
    command: redis-server --requirepass ${LOCAL_DEALS_REDIS_PASSWORD:?Set LOCAL_DEALS_REDIS_PASSWORD in .env}
    networks:
      - local-deals-net

  elasticsearch:
    build: ./docker/elasticsearch
    container_name: local-deals-es
    restart: always
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - ./es-data:/usr/share/elasticsearch/data
    networks:
      - local-deals-net

  nginx:
    image: nginx:1.22
    container_name: local-deals-nginx
    restart: always
    ports:
      - "8088:80"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/user:/usr/share/nginx/html/hmdp:ro
      - ./frontend/admin/dist:/usr/share/nginx/html/admin:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      local-deals-net:
        ipv4_address: 172.30.55.10

  canal-server:
    build: ./docker/canal
    container_name: local-deals-canal
    restart: always
    network_mode: host
    environment:
      - canal.instance.master.address=127.0.0.1:3306
      - canal.instance.dbUsername=root
      - canal.instance.dbPassword=${MYSQL_ROOT_PASSWORD}
      - canal.instance.filter.regex=local_deals\\.tb_shop,local_deals\\.tb_blog
      - canal.mq.servers=127.0.0.1:9876
      - canal.mq.topic=mysql-sync-topic
      - canal.serverMode=rocketmq
    depends_on:
      - mysql

networks:
  local-deals-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.55.0/24
