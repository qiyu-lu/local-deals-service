version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: local-deals-mysql
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: local_deals
    volumes:
      - ./mysql-data:/var/lib/mysql
    command:
      --default-authentication-plugin=mysql_native_password
    networks:
      - local-deals-net

  redis:
    image: redis:6.2
    container_name: local-deals-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - ./redis-data:/data
    command: redis-server --requirepass ${LOCAL_DEALS_REDIS_PASSWORD:?Set LOCAL_DEALS_REDIS_PASSWORD in .env}
    networks:
      - local-deals-net

  elasticsearch:
    build: ./docker/elasticsearch
    container_name: local-deals-es
    restart: always
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - ./es-data:/usr/share/elasticsearch/data
    networks:
      - local-deals-net

  canal-server:
    image: canal/canal-server:v1.1.7
    container_name: local-deals-canal
    restart: always
    ports:
      - "11111:11111"
    environment:
      - canal.instance.master.address=local-deals-mysql:3306
      - canal.instance.dbUsername=root
      - canal.instance.dbPassword=${MYSQL_ROOT_PASSWORD}
      - canal.instance.filter.regex=local_deals\\.tb_shop,local_deals\\.tb_blog
      - canal.mq.servers=host.docker.internal:9876
      - canal.mq.topic=mysql-sync-topic
      - canal.serverMode=rocketmq
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - mysql
    networks:
      - local-deals-net

networks:
  local-deals-net:
    driver: bridge
