<!DOCTYPE html>
<html lang="en">

<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
  <title>黑马点评</title>
  <!-- 引入样式 -->
  <link rel="stylesheet" href="./css/element.css">
  <link href="./css/main.css" rel="stylesheet">
  <link href="./css/info.css" rel="stylesheet">

  <style type="text/css">
      .el-tabs--bottom .el-tabs__item.is-bottom:nth-child(2), .el-tabs--bottom .el-tabs__item.is-top:nth-child(2), .el-tabs--top .el-tabs__item.is-bottom:nth-child(2), .el-tabs--top .el-tabs__item.is-top:nth-child(2) {
          padding-left: 15px;
      }

      .el-tabs, .el-tab-pane {
          height: 100%;
      }

      .el-tabs__header {
          height: 10%;
      }

      .el-tabs__content {
          height: 90%;
      }
  </style>

</head>

<body>
<div id="app">
  <div class="header">
    <div class="header-back-btn" @click="goBack"><i class="el-icon-arrow-left"></i></div>
    <div class="header-title">个人主页&nbsp;&nbsp;&nbsp;</div>
  </div>
  <div class="basic">
    <div class="basic-icon">
      <img :src="user.icon || '/imgs/icons/default-icon.png'" alt="">
    </div>
    <div class="basic-info">
      <div class="name">{{user.nickName}}</div>
      <span>杭州</span>
      <div class="edit-btn" @click="toEdit">
        编辑资料
      </div>
    </div>
    <div class="logout-btn" @click="logout">
      退出登录
    </div>
  </div>
  <div class="introduce">
    <span v-if="info.introduce"></span>
    <span v-else>添加个人简介，让大家更好的认识你 <i class="el-icon-edit"></i></span>
  </div>
  <div class="content">
    <el-tabs v-model="activeName" @tab-click="handleClick">
      <el-tab-pane label="笔记" name="1">
        <div v-for="b in blogs" :key="b.id" class="blog-item">
          <div class="blog-img"><img :src="b.images.split(',')[0]" alt=""></div>
          <div class="blog-info">
            <div class="blog-title">{{b.title}}</div>
            <div class="blog-liked"><img src="/imgs/thumbup.png" alt=""> {{b.liked}}</div>
            <div class="blog-comments"><i class="el-icon-chat-dot-round"></i> {{b.comments}}</div>
          </div>
        </div>
      </el-tab-pane>
      <el-tab-pane label="评价" name="2">评价</el-tab-pane>
      <el-tab-pane label="粉丝(0)" name="3">粉丝(0)</el-tab-pane>
      <el-tab-pane :label="'关注(' + myFollows.length + ')'" name="4">
        <div style="padding: 12px;">
          <div v-if="myFollows.length === 0" style="text-align:center;color:#9ca3af;padding:40px 0;">
            还没有关注任何人
          </div>
          <div v-for="u in myFollows" :key="u.id"
               style="display:flex;align-items:center;padding:10px 4px;border-bottom:1px solid #f3f4f6;"
               @click="toOtherInfo(u.id)">
            <img :src="u.icon || '/imgs/icons/default-icon.png'" alt=""
                 style="width:42px;height:42px;border-radius:50%;object-fit:cover;flex-shrink:0;">
            <div style="margin-left:12px;flex:1;">
              <div style="font-size:14px;font-weight:600;color:#111827;">{{u.nickName}}</div>
            </div>
            <i class="el-icon-arrow-right" style="color:#9ca3af;"></i>
          </div>
        </div>
      </el-tab-pane>
      <el-tab-pane label="券包" name="5">
        <div style="padding: 12px;">
          <div v-if="grantList.length === 0" style="text-align:center;color:#9ca3af;padding:40px 0;">
            暂无已发放优惠券
          </div>
          <div v-for="grant in grantList" :key="grant.id"
               style="padding:12px 4px;border-bottom:1px solid #f3f4f6;">
            <div style="font-size:15px;font-weight:600;color:#111827;">{{grant.campaignName || '优惠券'}}</div>
            <div style="margin-top:5px;color:#4b5563;">{{grant.voucherTitle || '已发放优惠券'}}</div>
            <div style="margin-top:5px;font-size:12px;color:#9ca3af;">{{grant.grantedAt || ''}}</div>
          </div>
        </div>
      </el-tab-pane>
    </el-tabs>
  </div>
  <foot-bar :active-btn="4"></foot-bar>
</div>
<script src="./js/vue.js"></script>
<script src="./js/axios.min.js"></script>
<!-- 引入组件库 -->
<script src="./js/element.js"></script>
<script src="./js/common.js"></script>
<script src="./js/footer.js"></script>
<script>
  const app = new Vue({
    el: "#app",
    data: {
      user: "",
      activeName: "1",
      info: {},
      blogs: [],
      myFollows: [], // 我关注的用户列表
      grantList: [], // 持久化券包事实
      grantSocket: null,
      seenGrantEvents: {},
      grantPollTimer: null,
      grantPollAttempts: 0,
      grantPollDeadline: 0,
      grantPollState: 'IDLE',
      blogs2: [], // 关注的人的播客
      params: {
        minTime: 0, // 上一次拉取到的时间戳
        offset: 0, // 偏移量
      },
      count: 5,
      isReachBottom: false,
    },
    created() {
      this.queryUser();
    },
    methods: {
      load() {
        this.count += 2;
      },
      queryBlogs() {
        axios.get("/blog/of/me")
          .then(({data}) => this.blogs = data)
          .catch(this.$message.error)
      },
      queryBlogsOfFollow(clear) {
        if (clear) {
          this.params.offset = 0;
          this.params.minTime = new Date().getTime() + 1;
        }
        let {minTime, offset: os} = this.params;
        axios.get("/blog/of/follow", {
            params: {offset: os, lastId: minTime || new Date().getTime() + 1}
          })
          .then(({data}) => {
            if (!data) {
              return;
            }
            let {list, ...params} = data;
            list.forEach(b => b.img = b.images.split(",")[0])
            this.blogs2 = clear ? list : this.blogs2.concat(list);
            this.params = params;
          })
          .catch(e => console.log(e))
      },
      queryUser() {
        // 查询用户信息
        axios.get("/user/me")
          .then(({data}) => {
            // 保存用户
            this.user = data;
            // 查询用户详情
            this.queryUserInfo();
            // 查询用户笔记
            this.queryBlogs();
            // 查询持久化券包，并建立一次用户通知连接
            this.queryGrants();
            this.connectGrantNotifications();
          })
          .catch(err => {
            location.href = "login.html"
          })
      },
      goBack() {
        history.back();
      },
      queryUserInfo() {
        axios.get("/user/info/" + this.user.id)
          .then(({data}) => {
            if (!data) {
              return
            }
            // 保存用户详情
            this.info = data;
            // 保存到本地
            sessionStorage.setItem("userInfo", JSON.stringify(data))
          })
          .catch(err => {
            this.$message.error(err);
          })
      },
      toEdit() {
        location.href = 'info-edit.html'
      },
      logout() {
        this.closeGrantSocket();
        axios.post("/user/logout")
          .then(() => {
            // 清理session
            sessionStorage.removeItem("token")
            // 跳转
            location.href = "/"
          })
          .catch(this.$message.error)
      },
      handleClick(r) {
        if (r.name === '4') {
          this.queryMyFollows();
        }
        if (r.name === '5') {
          this.queryGrants();
          this.connectGrantNotifications();
        }
      },
      queryMyFollows() {
        axios.get("/follow/my-follows")
          .then(({data}) => { this.myFollows = data || []; })
          .catch(e => console.log(e));
      },
      toOtherInfo(userId) {
        location.href = 'other-info.html?id=' + userId;
      },
      queryGrants() {
        return axios.get("/voucher-grants/mine")
          .then(({data}) => {
            this.grantList = Array.isArray(data) ? data : ((data && (data.list || data.records || data.data)) || []);
            return this.grantList;
          })
          .catch(e => console.log(e));
      },
      isGrantPollTerminal(status) {
        const normalized = String(status || '').toUpperCase();
        return normalized === 'SUCCESS' || normalized === 'FAILED';
      },
      stopGrantFallbackPoll(finalState) {
        if (this.grantPollTimer) {
          clearTimeout(this.grantPollTimer);
          this.grantPollTimer = null;
        }
        if (this.isGrantPollTerminal(finalState)) {
          this.grantPollState = String(finalState).toUpperCase();
        } else if (this.grantPollState === 'POLLING') {
          this.grantPollState = 'IDLE';
        }
      },
      startGrantFallbackPoll() {
        if (this.grantPollState === 'POLLING') return;
        this.stopGrantFallbackPoll();
        this.grantPollState = 'POLLING';
        this.grantPollAttempts = 0;
        this.grantPollDeadline = Date.now() + 30000;
        this.pollGrantFallback();
      },
      scheduleGrantFallbackPoll() {
        if (this.grantPollState !== 'POLLING' || this.grantPollAttempts >= 10 || Date.now() >= this.grantPollDeadline) {
          this.stopGrantFallbackPoll();
          return;
        }
        this.grantPollTimer = setTimeout(() => {
          this.grantPollTimer = null;
          this.pollGrantFallback();
        }, 2000);
      },
      pollGrantFallback() {
        if (this.grantPollState !== 'POLLING' || this.grantPollAttempts >= 10 || Date.now() >= this.grantPollDeadline) {
          this.stopGrantFallbackPoll();
          return;
        }
        this.grantPollAttempts += 1;
        axios.get("/voucher-grants/mine")
          .then(({data}) => {
            const payload = Array.isArray(data) ? null : (data || {});
            const list = Array.isArray(data) ? data : (payload.list || payload.records || payload.data || []);
            this.grantList = Array.isArray(list) ? list : [];
            if (payload && this.isGrantPollTerminal(payload.deliveryState || payload.status)) {
              this.stopGrantFallbackPoll(payload.deliveryState || payload.status);
              return;
            }
            this.scheduleGrantFallbackPoll();
          })
          .catch(() => this.scheduleGrantFallbackPoll());
      },
      connectGrantNotifications() {
        if (this.grantSocket || !token || typeof WebSocket === 'undefined') return;
        const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
        let socket;
        try {
          socket = new WebSocket(`${protocol}//${location.host}/api/ws/connect?token=${encodeURIComponent(token)}`);
        } catch (e) {
          return;
        }
        this.grantSocket = socket;
        socket.onopen = () => {
          if (this.grantSocket === socket) this.stopGrantFallbackPoll();
        };
        socket.onmessage = (event) => {
          try {
            const message = JSON.parse(event.data);
            if (message.type !== 'VOUCHER_GRANTED') return;
            const deliveryState = message.deliveryState || message.status || 'SUCCESS';
            if (this.isGrantPollTerminal(deliveryState)) this.stopGrantFallbackPoll(deliveryState);
            const eventId = String(message.eventId || '');
            if (eventId && this.seenGrantEvents[eventId]) return;
            if (eventId) this.$set(this.seenGrantEvents, eventId, true);
            this.queryGrants();
            this.$notify({
              title: '优惠券已到账',
              message: message.message || '优惠券已加入我的券包',
              type: 'success',
              duration: 4000,
              position: 'top-right'
            });
          } catch (e) {}
        };
        socket.onclose = () => {
          if (this.grantSocket === socket) {
            this.grantSocket = null;
            this.startGrantFallbackPoll();
          }
        };
        socket.onerror = () => {
          if (this.grantSocket === socket) {
            this.grantSocket = null;
            this.startGrantFallbackPoll();
          }
        };
      },
      closeGrantSocket() {
        this.stopGrantFallbackPoll();
        if (!this.grantSocket) return;
        const socket = this.grantSocket;
        this.grantSocket = null;
        socket.onmessage = null;
        socket.onclose = null;
        socket.onerror = null;
        if (socket.readyState === WebSocket.CONNECTING || socket.readyState === WebSocket.OPEN) {
          socket.close();
        }
      },
      addLike(b) {
        const desired = !Boolean(b.isLike);
        axios({method: desired ? "put" : "delete", url: "/blog/" + b.id + "/like"})
          .then(({data}) => {
            b.isLike = data.desired;
            if (data.changed) {
              b.liked = Math.max(0, (b.liked || 0) + (data.desired ? 1 : -1));
            }
          })
          .catch(err => {
            this.$message.error(err)
          })
      },
      queryBlogById(b) {
        axios.get("/blog/" + b.id)
          .then(({data}) => {
            b.liked = data.liked;
            b.isLike = data.isLike;
          })
          .catch(() => {
            this.$message.error
            b.liked++;
          })
      },
      onScroll(e) {
        let scrollTop = e.target.scrollTop;
        let offsetHeight = e.target.offsetHeight;
        let scrollHeight = e.target.scrollHeight;
        if (scrollTop === 0) {
          // 到顶部了，查询一次
          this.queryBlogsOfFollow(true);
        } else if (scrollTop + offsetHeight + 1 > scrollHeight && !this.isReachBottom) {
          this.isReachBottom = true
          // 再次查询下一页数据
          this.queryBlogsOfFollow();
        } else {
          this.isReachBottom = false
        }
      }
    },
    beforeDestroy() {
      this.closeGrantSocket();
    },

  })
</script>
</body>

</html>
