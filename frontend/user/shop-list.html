<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
  <title>LocalDeals</title>
  <link rel="stylesheet" href="./css/element.css">
  <link href="./css/shop-list.css" rel="stylesheet">
  <link href="./css/main.css" rel="stylesheet">
</head>
<body>
<div id="app">
  <div class="header">
    <div class="header-back-btn" @click="goBack"><i class="el-icon-arrow-left"></i></div>
    <div class="header-title">{{typeName}}</div>
    <div class="header-search" @click="toggleSearch" :title="isSearching ? '收起搜索' : 'ES 搜索'">
      <i :class="isSearching ? 'el-icon-close' : 'el-icon-search'"></i>
    </div>
  </div>

  <!-- ES 关键词搜索面板 -->
  <div class="search-panel" v-show="isSearching">
    <el-input
        v-model="keyword"
        placeholder="输入关键词，使用 ES 智能搜索..."
        size="small"
        clearable
        ref="searchInput"
        @clear="clearSearch"
        @keyup.enter.native="doSearch">
      <el-button slot="append" icon="el-icon-search" @click="doSearch"></el-button>
    </el-input>
  </div>

  <div class="sort-bar" v-show="!isSearching || !keyword">
    <div class="sort-item">
      <el-dropdown trigger="click" @command="handleCommand">
      <span class="el-dropdown-link">
        {{typeName}}<i class="el-icon-arrow-down el-icon--right"></i>
      </span>
        <el-dropdown-menu slot="dropdown">
          <el-dropdown-item v-for="t in types" :key="t.id" :command="t">
            {{t.name}}
          </el-dropdown-item>
        </el-dropdown-menu>
      </el-dropdown>
    </div>
    <div class="sort-item" @click="sortAndQuery('')">距离</div>
    <div class="sort-item" @click="sortAndQuery('comments')">人气</div>
    <div class="sort-item" @click="sortAndQuery('score')">评分</div>
  </div>

  <!-- ES 搜索提示 -->
  <div v-if="isEsSearch && keyword" style="padding: 6px 14px; font-size: 11px; color: var(--text-muted); background: var(--primary-light); border-bottom: 1px solid var(--border);">
    <i class="el-icon-info" style="color: var(--primary);"></i>
    ES IK 分词搜索「{{keyword}}」，共 {{shops.length}} 条结果
  </div>

  <div class="shop-list" @scroll="onScroll">
    <div v-if="shops.length === 0 && !loading" style="text-align:center; padding: 40px 0; color: var(--text-muted);">
      <i class="el-icon-search" style="font-size: 40px; display:block; margin-bottom: 10px;"></i>
      暂无结果
    </div>
    <div class="shop-box" v-for="s in shops" :key="s.id" @click="toDetail(s.id)">
      <div class="shop-img">
        <img :src="s.images || '/imgs/shop-default.jpg'" alt="" @error="$event.target.src='/imgs/shop-default.jpg'">
      </div>
      <div class="shop-info">
        <div class="shop-title shop-item">{{s.name}}</div>
        <div class="shop-rate shop-item">
          <el-rate disabled :value="(s.score || 0) / 10" text-color="var(--primary)" show-score></el-rate>
          <span v-if="s.comments">{{s.comments}}条</span>
          <span v-else-if="s.sold">{{s.sold}}单</span>
        </div>
        <div class="shop-area shop-item">
          <span>{{s.area || ''}}</span>
          <span class="shop-distance" v-if="s.distance">
            {{s.distance < 1000 ? s.distance.toFixed(0) + 'm' : (s.distance/1000).toFixed(1) + 'km'}}
          </span>
        </div>
        <div class="shop-avg shop-item">￥{{s.avgPrice}}/人</div>
        <div class="shop-address shop-item">
          <i class="el-icon-map-location"></i>
          <span>{{s.address}}</span>
        </div>
      </div>
    </div>
    <div v-if="loading" style="text-align:center; padding: 12px 0; color: var(--text-muted); font-size: 12px;">
      <i class="el-icon-loading"></i> 加载中...
    </div>
  </div>
</div>
<script src="./js/vue.js"></script>
<script src="./js/axios.min.js"></script>
<script src="./js/element.js"></script>
<script src="./js/common.js"></script>
<script>

  const app = new Vue({
    el: "#app",
    data: {
      util,
      isReachBottom: false,
      loading: false,
      types: [],
      shops: [],
      typeName: "",
      isSearching: false,
      isEsSearch: false,
      keyword: "",
      params: {
        typeId: 0,
        current: 1,
        sortBy: "",
        x: 120.149993,
        y: 30.334229
      }
    },
    created() {
      this.params.typeId = util.getUrlParam("type");
      this.typeName = util.getUrlParam("name");
      this.queryTypes();
      this.queryShops();
      // 尝试获取用户地理位置
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(pos => {
          this.params.x = pos.coords.longitude;
          this.params.y = pos.coords.latitude;
        });
      }
    },
    methods: {
      queryTypes() {
        axios.get("/shop-type/list")
          .then(({data}) => { this.types = data; })
          .catch(err => console.log(err));
      },
      queryShops() {
        if (this.isEsSearch && this.keyword) {
          this.queryShopsByKeyword();
          return;
        }
        this.loading = true;
        axios.get("/shop/of/type", { params: this.params })
          .then(({data}) => {
            if (!data) return;
            data.forEach(s => s.images = (s.images || '').split(',')[0]);
            this.shops = this.shops.concat(data);
          })
          .catch(err => this.$message.error(err))
          .finally(() => { this.loading = false; });
      },
      queryShopsByKeyword() {
        this.loading = true;
        axios.get("/shop/search", {
          params: {
            keyword: this.keyword,
            x: this.params.x,
            y: this.params.y,
            typeId: this.params.typeId || undefined,
            current: this.params.current
          }
        }).then(({data}) => {
          if (!data || !data.length) return;
          data.forEach(s => s.images = (s.images || '').split(',')[0]);
          this.shops = this.shops.concat(data);
        }).catch(err => this.$message.error(err))
          .finally(() => { this.loading = false; });
      },
      toggleSearch() {
        this.isSearching = !this.isSearching;
        if (this.isSearching) {
          this.$nextTick(() => this.$refs.searchInput && this.$refs.searchInput.focus());
        } else {
          this.clearSearch();
        }
      },
      doSearch() {
        if (!this.keyword.trim()) { this.clearSearch(); return; }
        this.isEsSearch = true;
        this.shops = [];
        this.params.current = 1;
        this.queryShopsByKeyword();
      },
      clearSearch() {
        this.keyword = '';
        this.isEsSearch = false;
        this.shops = [];
        this.params.current = 1;
        this.queryShops();
      },
      handleCommand(t) {
        location.href = "/shop-list.html?type=" + t.id + "&name=" + t.name;
      },
      sortAndQuery(sortBy) {
        this.params.sortBy = sortBy;
        this.shops = [];
        this.params.current = 1;
        this.queryShops();
      },
      goBack() { history.back(); },
      toDetail(id) { location.href = "/shop-detail.html?id=" + id; },
      onScroll(e) {
        const { scrollTop, offsetHeight, scrollHeight } = e.target;
        if (scrollTop + offsetHeight + 2 > scrollHeight && !this.isReachBottom && !this.loading) {
          this.isReachBottom = true;
          this.params.current++;
          this.queryShops();
        } else {
          this.isReachBottom = false;
        }
      }
    }
  })
</script>
</body>
</html>
