worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json text/plain font/woff2;

    upstream backend {
        server host.docker.internal:8083;  # Docker 内访问宿主机后端
    }

    server {
        listen 80;
        server_name localhost;

        # 用户端（手机端）
        root /usr/share/nginx/html/hmdp;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
            location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
                expires 7d;
                add_header Cache-Control "public, max-age=604800, immutable";
            }
        }

        # 管理端（Vue Router hash 模式）
        location /admin/ {
            alias /usr/share/nginx/html/admin/;
            try_files $uri $uri/ /admin/index.html;
            location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
                expires 7d;
                add_header Cache-Control "public, max-age=604800, immutable";
            }
        }

        # Actuator is served on a separate trusted management port and must never traverse
        # the public business reverse proxy. Consumer/admin tokens are not monitoring credentials.
        location ^~ /api/actuator {
            return 404;
        }

        # 反向代理 API（含 WebSocket 升级头）
        location /api/ {
            rewrite /api(/.*) $1 break;
            proxy_pass http://backend;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # 错误页面
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}

