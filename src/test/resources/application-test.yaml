logging:
  level:
    com.localdeals: DEBUG
    org.springframework: WARN
    com.zaxxer.hikari: WARN
spring:
  elasticsearch:
    uris: http://localhost:9200
rocketmq:
  name-server: localhost:9876
  producer:
    group: local-deals-producer-group
  consumer:
    # Most Spring integration tests call consumers directly. Keeping fixed-group listeners
    # alive in every cached ApplicationContext makes those contexts compete for real broker
    # messages and turns an otherwise deterministic suite into a cross-test race.
    listeners:
      seckill-consumer-group:
        seckill-order-topic: false
      es-sync-consumer-group:
        mysql-sync-topic: false
      order-close-consumer-group:
        order-close-topic: false
local-deals:
  observability:
    # Tests opt in only when they own isolated MySQL and Redis targets.
    sampling-enabled: false
  blog-hot-rank:
    refresh-enabled: false
  blog-like:
    # Tests call the batch worker explicitly; never drain shared test data in the background.
    worker-enabled: false
  voucher-batch:
    # Tests drive the batch and notification workers explicitly.
    job-worker-enabled: false
    notification-worker-enabled: false
  coupon:
    expiry-enabled: false
  order:
    scan:
      # Tests call OrderTimeoutScanner.scanOnce() explicitly.
      enabled: false
  seckill:
    reconciliation:
      # Tests opt in explicitly when exercising the worker.
      enabled: false
      compensation-enabled: false
