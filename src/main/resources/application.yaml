server:
  port: 8083
spring:
  application:
    name: local-deals-service
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # rewriteBatchedStatements lets the driver send a batch as one packet; the seckill consumer
    # persists a whole batch per voucher in one round trip.
    url: "${LOCAL_DEALS_DATASOURCE_URL:jdbc:mysql://localhost:3306/local_deals?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true&rewriteBatchedStatements=true}"
    username: "${LOCAL_DEALS_DATASOURCE_USERNAME:root}"
    password: "${LOCAL_DEALS_DATASOURCE_PASSWORD}"
    hikari:
      # Sized above the seckill consume threads so a consumer never waits for a connection.
      maximum-pool-size: "${LOCAL_DEALS_DB_POOL_SIZE:24}"
      minimum-idle: "${LOCAL_DEALS_DB_POOL_MIN_IDLE:8}"
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true
  data:
    redis:
      host: "${LOCAL_DEALS_REDIS_HOST:localhost}"
      port: "${LOCAL_DEALS_REDIS_PORT:6379}"
      password: "${LOCAL_DEALS_REDIS_PASSWORD}"
      timeout: "${LOCAL_DEALS_REDIS_COMMAND_TIMEOUT:500ms}"
      lettuce:
        pool:
          max-active: 10
          max-idle: 10
          min-idle: 1
          max-wait: "${LOCAL_DEALS_REDIS_POOL_MAX_WAIT:500ms}"
          time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
  servlet:
    multipart:
      max-file-size: "${LOCAL_DEALS_MAX_IMAGE_SIZE:5MB}"
      max-request-size: "${LOCAL_DEALS_MAX_UPLOAD_REQUEST_SIZE:6MB}"
  elasticsearch:
    uris: http://localhost:9200
mybatis-plus:
  type-aliases-package: com.localdeals.*.entity # 别名扫描包
logging:
  level:
    # Keep mapper parameters (including password hashes and user data) out of production logs.
    com.localdeals: info
management:
  server:
    port: "${LOCAL_DEALS_MANAGEMENT_PORT:18084}"
    address: "${LOCAL_DEALS_MANAGEMENT_ADDRESS:127.0.0.1}"
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: ping
        readiness:
          include: db,redis
local-deals:
  # Shared business-day boundary for DAILY_SIGN_IN and TASK_REWARD keys.
  business-time-zone: "${LOCAL_DEALS_BUSINESS_TIME_ZONE:Asia/Shanghai}"
  client-ip:
    # Proxy headers are trusted only when the direct peer is in this explicit list.
    trusted-proxies: "${LOCAL_DEALS_TRUSTED_PROXIES:${LOCAL_DEALS_ADMIN_TRUSTED_PROXIES:}}"
  cache:
    shop-detail-ttl: "${LOCAL_DEALS_CACHE_SHOP_DETAIL_TTL:30s}"
    shop-detail-empty-ttl: "${LOCAL_DEALS_CACHE_SHOP_DETAIL_EMPTY_TTL:30s}"
    shop-type-ttl: "${LOCAL_DEALS_CACHE_SHOP_TYPE_TTL:100m}"
    shop-type-empty-ttl: "${LOCAL_DEALS_CACHE_SHOP_TYPE_EMPTY_TTL:30s}"
  observability:
    sampling-enabled: "${LOCAL_DEALS_OBSERVABILITY_SAMPLING_ENABLED:true}"
    initial-delay: "${LOCAL_DEALS_OBSERVABILITY_INITIAL_DELAY:10s}"
    sampling-interval: "${LOCAL_DEALS_OBSERVABILITY_SAMPLING_INTERVAL:30s}"
  admin:
    # Create-only, fail-closed platform account bootstrap. No default credential exists.
    bootstrap:
      username: "${LOCAL_DEALS_ADMIN_BOOTSTRAP_USERNAME:}"
      password: "${LOCAL_DEALS_ADMIN_BOOTSTRAP_PASSWORD:}"
      display-name: "${LOCAL_DEALS_ADMIN_BOOTSTRAP_DISPLAY_NAME:平台管理员}"
    session-ttl: "${LOCAL_DEALS_ADMIN_SESSION_TTL:30m}"
    max-login-failures: "${LOCAL_DEALS_ADMIN_MAX_LOGIN_FAILURES:5}"
    max-ip-login-attempts: "${LOCAL_DEALS_ADMIN_MAX_IP_LOGIN_ATTEMPTS:30}"
    login-lock-duration: "${LOCAL_DEALS_ADMIN_LOGIN_LOCK_DURATION:15m}"
  auth:
    # Never enable this outside an isolated local development environment.
    log-verification-code: "${LOCAL_DEALS_LOG_VERIFICATION_CODE:false}"
  traffic:
    seckill:
      enabled: "${LOCAL_DEALS_SECKILL_RATE_LIMIT_ENABLED:true}"
      window: "${LOCAL_DEALS_SECKILL_RATE_WINDOW:1s}"
      user-limit: "${LOCAL_DEALS_SECKILL_USER_LIMIT:2}"
      ip-limit: "${LOCAL_DEALS_SECKILL_IP_LIMIT:100}"
    read:
      db-max-concurrent: "${LOCAL_DEALS_DB_READ_MAX_CONCURRENT:4}"
      db-max-wait: "${LOCAL_DEALS_DB_READ_MAX_WAIT:20ms}"
      shared-load-wait: "${LOCAL_DEALS_SHARED_LOAD_WAIT:750ms}"
      search-max-concurrent: "${LOCAL_DEALS_SEARCH_MAX_CONCURRENT:4}"
      search-max-wait: "${LOCAL_DEALS_SEARCH_MAX_WAIT:20ms}"
    search:
      connect-timeout: "${LOCAL_DEALS_ES_CONNECT_TIMEOUT:500ms}"
      socket-timeout: "${LOCAL_DEALS_ES_SOCKET_TIMEOUT:1s}"
  upload:
    image-root: "${LOCAL_DEALS_IMAGE_UPLOAD_DIR:./frontend/user/imgs}"
    max-image-size: "${LOCAL_DEALS_MAX_IMAGE_SIZE:5MB}"
  websocket:
    allowed-origins: "${LOCAL_DEALS_WEBSOCKET_ALLOWED_ORIGINS:http://localhost:8088,http://localhost:5173}"
  blog-hot-rank:
    # Unsafe cache states (not ready, stale, Redis down) always fall back to MySQL.
    refresh-enabled: "${LOCAL_DEALS_BLOG_HOT_RANK_REFRESH_ENABLED:true}"
    top-k: "${LOCAL_DEALS_BLOG_HOT_RANK_TOP_K:1000}"
    page-size: "${LOCAL_DEALS_BLOG_HOT_RANK_PAGE_SIZE:10}"
    initial-delay: "${LOCAL_DEALS_BLOG_HOT_RANK_INITIAL_DELAY:10s}"
    fixed-delay: "${LOCAL_DEALS_BLOG_HOT_RANK_FIXED_DELAY:30s}"
    max-stale: "${LOCAL_DEALS_BLOG_HOT_RANK_MAX_STALE:2m}"
  blog-like:
    worker-enabled: "${LOCAL_DEALS_BLOG_LIKE_WORKER_ENABLED:true}"
    initial-delay: "${LOCAL_DEALS_BLOG_LIKE_INITIAL_DELAY:5s}"
    fixed-delay: "${LOCAL_DEALS_BLOG_LIKE_FIXED_DELAY:200ms}"
    batch-size: "${LOCAL_DEALS_BLOG_LIKE_BATCH_SIZE:500}"
    processed-retention: "${LOCAL_DEALS_BLOG_LIKE_PROCESSED_RETENTION:1d}"
    cleanup-fixed-delay: "${LOCAL_DEALS_BLOG_LIKE_CLEANUP_FIXED_DELAY:1s}"
    cleanup-batch-size: "${LOCAL_DEALS_BLOG_LIKE_CLEANUP_BATCH_SIZE:2000}"
    cleanup-max-batches: "${LOCAL_DEALS_BLOG_LIKE_CLEANUP_MAX_BATCHES:5}"
  voucher-batch:
    # Worker start/stop switches; every node runs them by default.
    job-worker-enabled: "${LOCAL_DEALS_VOUCHER_BATCH_JOB_WORKER_ENABLED:true}"
    notification-worker-enabled: "${LOCAL_DEALS_VOUCHER_NOTIFICATION_WORKER_ENABLED:true}"
    initial-delay: "${LOCAL_DEALS_VOUCHER_BATCH_INITIAL_DELAY:5s}"
    fixed-delay: "${LOCAL_DEALS_VOUCHER_BATCH_FIXED_DELAY:1s}"
    batch-size: "${LOCAL_DEALS_VOUCHER_BATCH_SIZE:50}"
    notification-batch-size: "${LOCAL_DEALS_VOUCHER_NOTIFICATION_BATCH_SIZE:50}"
    notification-max-attempts: "${LOCAL_DEALS_VOUCHER_NOTIFICATION_MAX_ATTEMPTS:10}"
    notification-max-backoff: "${LOCAL_DEALS_VOUCHER_NOTIFICATION_MAX_BACKOFF:5m}"
  order:
    pay-timeout: "${LOCAL_DEALS_ORDER_PAY_TIMEOUT:15m}"
    worker-lease-ttl: "${LOCAL_DEALS_ORDER_WORKER_LEASE_TTL:30s}"
    close-topic: "${LOCAL_DEALS_ORDER_CLOSE_TOPIC:order-close-topic}"
    close-consumer-group: "${LOCAL_DEALS_ORDER_CLOSE_CONSUMER_GROUP:order-close-consumer-group}"
    scan:
      # Fallback for lost timer messages and unfinished Redis releases; safe on every node.
      enabled: "${LOCAL_DEALS_ORDER_SCAN_ENABLED:true}"
      fixed-delay: "${LOCAL_DEALS_ORDER_SCAN_FIXED_DELAY:10s}"
      grace: "${LOCAL_DEALS_ORDER_SCAN_GRACE:30s}"
  payment:
    # Shared with the mock channel. Override outside local development.
    callback-secret: "${LOCAL_DEALS_PAYMENT_CALLBACK_SECRET:local-dev-mock-channel-secret}"
    mock-channel:
      notify-base-url: "${LOCAL_DEALS_PAYMENT_NOTIFY_BASE_URL:http://127.0.0.1:${server.port}}"
  coupon:
    expiry-enabled: "${LOCAL_DEALS_COUPON_EXPIRY_ENABLED:true}"
    verify-limit-per-minute: "${LOCAL_DEALS_COUPON_VERIFY_LIMIT_PER_MINUTE:120}"
  seckill:
    topic: "${LOCAL_DEALS_SECKILL_TOPIC:seckill-order-topic}"
    bucket:
      # A voucher's stock is split into this many buckets: one buyer, one bucket, one Cluster
      # slot. A power of two up to 1024 (the order number carries userId % 1024 in its low
      # bits, which is how a bucket is recovered from an order number alone). Changing it while
      # orders are in flight strands the state of the old buckets — drain first.
      count: "${LOCAL_DEALS_SECKILL_BUCKETS:16}"
    token:
      # Purchases need a short-lived token issued only while the activity is open.
      required: "${LOCAL_DEALS_SECKILL_TOKEN_REQUIRED:true}"
      # Override outside local development.
      secret: "${LOCAL_DEALS_SECKILL_TOKEN_SECRET:local-dev-seckill-token-secret}"
      ttl: "${LOCAL_DEALS_SECKILL_TOKEN_TTL:10m}"
    consume:
      enabled: "${LOCAL_DEALS_SECKILL_CONSUME_ENABLED:true}"
      # These four are the M6 sweep's winning combination, shipped whole because that is how it
      # was measured: 2001.5 orders/s, drained 0.1 s after the load, mean batch 12.68.
      # See benchmark/v2/m6/consume-sweep.md.
      # One consume call takes this many messages: one INSERT and one stock UPDATE per voucher.
      batch-size: "${LOCAL_DEALS_SECKILL_CONSUME_BATCH_SIZE:256}"
      thread-count: "${LOCAL_DEALS_SECKILL_CONSUME_THREADS:4}"
      # Messages one pull brings back; a consume batch can never exceed it.
      pull-batch-size: "${LOCAL_DEALS_SECKILL_CONSUME_PULL_BATCH_SIZE:256}"
      # How long a queue waits between pulls. Zero pulls continuously, and a consumer that keeps
      # up with the arrivals then only ever finds one message waiting (measured: mean batch 2.16).
      # At 2000 orders/s, 50 ms accumulates a mean batch of 12.68 instead, and costs each order
      # up to one interval of extra latency before it lands.
      pull-interval: "${LOCAL_DEALS_SECKILL_CONSUME_PULL_INTERVAL:50ms}"
      # How long a claimed batch is leased away from the reconciler.
      claim-lease: "${LOCAL_DEALS_SECKILL_CONSUME_CLAIM_LEASE:30s}"
    funnel:
      # L2: per-instance permits/s = remaining stock x factor (never below the floor).
      stock-factor: "${LOCAL_DEALS_SECKILL_STOCK_FACTOR:2.0}"
      min-permits-per-second: "${LOCAL_DEALS_SECKILL_MIN_PERMITS:50}"
      # L1: a voucher flagged sold out still sends one probe per interval to Redis.
      sold-out-probe-interval: "${LOCAL_DEALS_SECKILL_SOLD_OUT_PROBE:1s}"
    consumer-group: "${LOCAL_DEALS_SECKILL_CONSUMER_GROUP:seckill-consumer-group}"
    reconciliation:
      # Operational switches: the worker, and separately the stock-releasing compensation.
      enabled: "${LOCAL_DEALS_SECKILL_RECONCILIATION_ENABLED:true}"
      compensation-enabled: "${LOCAL_DEALS_SECKILL_COMPENSATION_ENABLED:true}"
      initial-delay: "${LOCAL_DEALS_SECKILL_RECONCILIATION_INITIAL_DELAY:30s}"
      fixed-delay: "${LOCAL_DEALS_SECKILL_RECONCILIATION_FIXED_DELAY:10s}"
      stale-after: "${LOCAL_DEALS_SECKILL_RECONCILIATION_STALE_AFTER:2m}"
      retry-delay: "${LOCAL_DEALS_SECKILL_RECONCILIATION_RETRY_DELAY:1m}"
      final-timeout: "${LOCAL_DEALS_SECKILL_RECONCILIATION_FINAL_TIMEOUT:15m}"
      batch-size: "${LOCAL_DEALS_SECKILL_RECONCILIATION_BATCH_SIZE:100}"
  es-sync:
    topic: "${LOCAL_DEALS_ES_SYNC_TOPIC:mysql-sync-topic}"
    consumer-group: "${LOCAL_DEALS_ES_SYNC_CONSUMER_GROUP:es-sync-consumer-group}"
rocketmq:
  name-server: localhost:9876
  producer:
    group: "${LOCAL_DEALS_ROCKETMQ_PRODUCER_GROUP:local-deals-producer-group}"
    send-message-timeout: 1000
    retry-times-when-send-failed: 0
