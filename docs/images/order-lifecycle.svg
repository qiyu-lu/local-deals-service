<svg xmlns="http://www.w3.org/2000/svg" width="880" height="316" viewBox="0 0 880 316" role="img" aria-labelledby="title desc">
<title id="title">订单生命周期</title>
<desc id="desc">待支付经支付回调变为已支付，超时则关单；已支付可到店核销，或申请退款进入退款中，退款回调后变为已退款。</desc>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "WenQuanYi Micro Hei", sans-serif; }
.t { font-size: 15px; font-weight: 600; }
.s { font-size: 12.5px; }
.em { font-size: 12.5px; font-weight: 600; }
.m { font-size: 12px; font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
.lbl { font-size: 13px; font-weight: 600; }
.lgd { font-size: 12px; }
.gt { font-size: 14px; font-weight: 600; }
.bn, .ba, .bg, .bp, .bo, .bt { stroke-width: 1.2; }
.grp { stroke-width: 1.2; stroke-dasharray: 6 4; }
.ln, .lr, .lx { fill: none; stroke-width: 1.6; }
.lr { stroke-dasharray: 6 4; }
.lx { stroke-width: 1.3; }

.card { fill: #ffffff; stroke: #d0d7de; }
.t, .gt { fill: #1f2328; }
.s, .lgd { fill: #59636e; }
.m { fill: #59636e; }
.em { fill: #0969da; }
.lbl { fill: #1f2328; }
.dot { fill: #1f2328; }
.bn { fill: #f6f8fa; stroke: #d0d7de; }
.ba { fill: #ddf4ff; stroke: #54aeff; }
.bg { fill: #dafbe1; stroke: #4ac26b; }
.bp { fill: #fbefff; stroke: #c297ff; }
.bo { fill: #fff1e5; stroke: #fb8f44; }
.bt { fill: #eaeef2; stroke: #afb8c1; }
.grp { fill: rgba(84,174,255,0.07); stroke: #54aeff; }
.ln { stroke: #59636e; }
.lr { stroke: #bc4c00; }
.lx { stroke: #8c959f; }
.mk-n { fill: #59636e; }
.mk-r { fill: #bc4c00; }
.mk-x { fill: #8c959f; }
@media (prefers-color-scheme: dark) {
.card { fill: #0d1117; stroke: #30363d; }
.t, .gt { fill: #e6edf3; }
.s, .lgd { fill: #9198a1; }
.m { fill: #9198a1; }
.em { fill: #4493f8; }
.lbl { fill: #e6edf3; }
.dot { fill: #e6edf3; }
.bn { fill: #161b22; stroke: #3d444d; }
.ba { fill: rgba(56,139,253,0.15); stroke: #1f6feb; }
.bg { fill: rgba(46,160,67,0.15); stroke: #2ea043; }
.bp { fill: rgba(171,125,248,0.15); stroke: #8957e5; }
.bo { fill: rgba(219,109,40,0.15); stroke: #db6d28; }
.bt { fill: #21262d; stroke: #3d444d; }
.grp { fill: rgba(56,139,253,0.06); stroke: #1f6feb; }
.ln { stroke: #9198a1; }
.lr { stroke: #f0883e; }
.lx { stroke: #6e7681; }
.mk-n { fill: #9198a1; }
.mk-r { fill: #f0883e; }
.mk-x { fill: #6e7681; }
}
</style>
<defs>
<marker id="am" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-n"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-r"/></marker>
<marker id="ax" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-x"/></marker>
</defs>
<rect x="0.5" y="0.5" width="879" height="315" rx="12" class="card"/>
<rect x="106" y="42" width="168" height="60" rx="8" class="ba"/>
<text x="190.0" y="68.0" class="t" text-anchor="middle">待支付</text>
<text x="190.0" y="86.0" class="m" text-anchor="middle">PENDING_PAY</text>
<rect x="386" y="42" width="168" height="60" rx="8" class="ba"/>
<text x="470.0" y="68.0" class="t" text-anchor="middle">已支付</text>
<text x="470.0" y="86.0" class="m" text-anchor="middle">PAID</text>
<rect x="666" y="42" width="168" height="60" rx="8" class="bt"/>
<text x="750.0" y="68.0" class="t" text-anchor="middle">已核销</text>
<text x="750.0" y="86.0" class="m" text-anchor="middle">USED</text>
<rect x="106" y="202" width="168" height="60" rx="8" class="bt"/>
<text x="190.0" y="228.0" class="t" text-anchor="middle">已关单</text>
<text x="190.0" y="246.0" class="m" text-anchor="middle">CLOSED</text>
<rect x="386" y="202" width="168" height="60" rx="8" class="ba"/>
<text x="470.0" y="228.0" class="t" text-anchor="middle">退款中</text>
<text x="470.0" y="246.0" class="m" text-anchor="middle">REFUNDING</text>
<rect x="666" y="202" width="168" height="60" rx="8" class="bt"/>
<text x="750.0" y="228.0" class="t" text-anchor="middle">已退款</text>
<text x="750.0" y="246.0" class="m" text-anchor="middle">REFUNDED</text>
<circle cx="44" cy="72" r="8" class="dot"/>
<path d="M52,72 H106" class="ln" marker-end="url(#am)"/>
<text x="79.0" y="63" class="s" text-anchor="middle">建单</text>
<path d="M274,72 H386" class="ln" marker-end="url(#am)"/>
<text x="330.0" y="63" class="lbl" text-anchor="middle">支付回调</text>
<text x="330.0" y="92" class="s" text-anchor="middle">同事务发券</text>
<path d="M554,72 H666" class="ln" marker-end="url(#am)"/>
<text x="610.0" y="63" class="lbl" text-anchor="middle">到店核销</text>
<text x="610.0" y="92" class="s" text-anchor="middle">券 → 已使用</text>
<path d="M554,232 H666" class="ln" marker-end="url(#am)"/>
<text x="610.0" y="223" class="lbl" text-anchor="middle">退款回调</text>
<text x="610.0" y="252" class="s" text-anchor="middle">券失效 · 库存 +1</text>
<path d="M190,102 V202" class="ln" marker-end="url(#am)"/>
<text x="202" y="148.0" class="lbl" text-anchor="start">超时关单</text>
<text x="202" y="167.0" class="s" text-anchor="start">库存 +1 · 释放预占</text>
<path d="M470,102 V202" class="ln" marker-end="url(#am)"/>
<text x="482" y="148.0" class="lbl" text-anchor="start">申请退款</text>
<text x="482" y="167.0" class="s" text-anchor="start">券冻结，不可核销</text>
<rect x="106" y="280" width="14" height="14" rx="3" class="ba"/>
<text x="128" y="291.5" class="lgd" text-anchor="start">进行中</text>
<rect x="190" y="280" width="14" height="14" rx="3" class="bt"/>
<text x="212" y="291.5" class="lgd" text-anchor="start">终态</text>
</svg>
